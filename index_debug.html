<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunSensor Debug</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#111}
.wrap{max-width:760px;margin:auto}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
button{font-size:17px;min-height:48px;border:0;border-radius:12px;padding:10px 12px;background:#e8edf2;margin:4px}
.primary{background:#1565c0;color:white}
#log{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:13px;min-height:120px;background:#0f1720;color:#dce7f0;border-radius:10px;padding:10px}
.status{font-weight:700;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>RunSensor Debug</h1>
    <div id="status" class="status">起動確認中...</div>
    <button class="primary" onclick="connectBLE()">BLE接続</button>
    <button onclick="testButton()">JSテスト</button>
  </div>
  <div class="card">
    <h2>環境</h2>
    <div id="env"></div>
  </div>
  <div class="card">
    <h2>ログ</h2>
    <div id="log"></div>
  </div>
</div>

<script>
"use strict";

const SERVICE_UUID = "12345678-1234-1234-1234-1234567890ab";
const CONTROL_UUID = "12345678-1234-1234-1234-1234567890af";
const DATA_UUID    = "12345678-1234-1234-1234-1234567890b0";

const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const envEl = document.getElementById("env");

function log(msg){
  const now = new Date().toLocaleTimeString();
  logEl.textContent += "[" + now + "] " + msg + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

window.addEventListener("error", function(e){
  log("JS ERROR: " + e.message + " @ " + e.lineno + ":" + e.colno);
});

window.addEventListener("unhandledrejection", function(e){
  let reason = e.reason && e.reason.message ? e.reason.message : String(e.reason || "unknown");
  log("PROMISE ERROR: " + reason);
});

function testButton(){
  log("JSテストボタンは動作しています");
  alert("JavaScript OK");
}

async function connectBLE(){
  log("BLE接続ボタンが押されました");

  try{
    if(!navigator.bluetooth){
      throw new Error("navigator.bluetooth がありません。Bluefyで開いているか、Bluetooth権限を確認してください。");
    }

    log("Web Bluetooth APIあり");
    log("デバイス選択画面を開きます...");

    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    });

    log("選択: " + (device.name || "(名前なし)"));
    statusEl.textContent = "接続中...";

    const server = await device.gatt.connect();
    log("GATT接続成功");

    const service = await server.getPrimaryService(SERVICE_UUID);
    log("RunSensor service取得成功");

    await service.getCharacteristic(CONTROL_UUID);
    const data = await service.getCharacteristic(DATA_UUID);

    await data.startNotifications();
    log("90B0 Indicate/Notify購読成功");

    statusEl.textContent = "接続済み: " + (device.name || "RunSensor");
    log("BLE接続完了");

  }catch(err){
    statusEl.textContent = "接続失敗";
    log("接続エラー: " + (err.name || "Error") + ": " + (err.message || String(err)));
  }
}

(function boot(){
  const hasBluetooth = !!navigator.bluetooth;
  envEl.innerHTML =
    "<div>UserAgent: " + navigator.userAgent + "</div>" +
    "<div>navigator.bluetooth: <b>" + (hasBluetooth ? "あり" : "なし") + "</b></div>" +
    "<div>HTTPS: <b>" + (location.protocol === "https:" ? "はい" : "いいえ") + "</b></div>";

  statusEl.textContent = "ページ起動済み";
  log("JavaScript起動OK");
  log("navigator.bluetooth: " + (hasBluetooth ? "あり" : "なし"));
})();
</script>
</body>
</html>
