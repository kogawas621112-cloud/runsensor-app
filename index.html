<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RunSensor</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#111}.wrap{max-width:760px;margin:auto}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0001}.grid,.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{font-size:17px;min-height:48px;border:0;border-radius:12px;padding:10px;background:#e8edf2}button.primary{background:#1565c0;color:#fff}button.danger{background:#c62828;color:#fff}button:disabled{opacity:.45}.metric{padding:12px;border-radius:12px;background:#f7f8fa}.v{font-size:22px;font-weight:700}.k,.small{font-size:12px;color:#666}canvas{width:100%;height:240px;border:1px solid #ddd;border-radius:10px;background:#fff}#log{white-space:pre-wrap;font:12px ui-monospace,monospace;max-height:180px;overflow:auto;background:#0f1720;color:#dce7f0;border-radius:10px;padding:10px}</style></head><body><div class="wrap">
<div class="card"><h1>RunSensor</h1><div id="status"><b>未接続</b></div><div class="grid">
<button id="connect" class="primary">BLE接続</button><button id="disconnect" disabled>切断</button>
<button id="start" disabled>計測 START</button><button id="stop" class="danger" disabled>STOP</button>
<button id="download" disabled>データ取得</button><button id="clear">画面データ消去</button>
<button id="csv" disabled>CSV保存</button></div></div>
<div class="card"><h2>受信状況</h2><div class="metrics">
<div class="metric"><div id="count" class="v">0</div><div class="k">受信サンプル</div></div>
<div class="metric"><div id="duration" class="v">0.00 s</div><div class="k">計測時間</div></div>
<div class="metric"><div id="maxg" class="v">-</div><div class="k">最大加速度合成 [g]</div></div>
<div class="metric"><div id="cadence" class="v">-</div><div class="k">推定ケイデンス [steps/min]</div></div></div>
<p id="dlstate" class="small">DOWNLOAD待機中</p></div>
<div class="card"><h2>加速度合成</h2><canvas id="chart" width="900" height="320"></canvas><p class="small">v1は簡易ピーク検出です。接地判定は今後調整できます。</p></div>
<div class="card"><h2>ログ</h2><div id="log"></div></div></div>
<script>
'use strict';
const SERVICE='12345678-1234-1234-1234-1234567890ab', CONTROL='12345678-1234-1234-1234-1234567890af', DATA='12345678-1234-1234-1234-1234567890b0';
let device,controlChar,dataChar,samples=[],timer=null,downloading=false;
const $=id=>document.getElementById(id), logEl=$('log'), canvas=$('chart'),ctx=canvas.getContext('2d');
function log(m){logEl.textContent+=`[${new Date().toLocaleTimeString()}] ${m}
`;logEl.scrollTop=logEl.scrollHeight}
function ui(c){$('connect').disabled=c;$('disconnect').disabled=!c;$('start').disabled=!c;$('stop').disabled=!c;$('download').disabled=!c}
async function connectBLE(){try{if(!navigator.bluetooth)throw Error('Web Bluetoothが利用できません。iPhoneではBluefyで開いてください。');device=await navigator.bluetooth.requestDevice({filters:[{name:'RunSensor'}],optionalServices:[SERVICE]});device.addEventListener('gattserverdisconnected',()=>{ui(false);$('status').innerHTML='<b>未接続</b>';log('BLE切断')});const server=await device.gatt.connect();const svc=await server.getPrimaryService(SERVICE);controlChar=await svc.getCharacteristic(CONTROL);dataChar=await svc.getCharacteristic(DATA);await dataChar.startNotifications();dataChar.addEventListener('characteristicvaluechanged',onData);$('status').innerHTML='<b>接続済み: RunSensor</b>';ui(true);log('BLE接続成功 / 90B0受信開始')}catch(e){log('接続エラー: '+e.message)}}
async function writeCmd(c){try{const d=new TextEncoder().encode(c);if(controlChar.writeValueWithResponse)await controlChar.writeValueWithResponse(d);else await controlChar.writeValue(d);log('送信: '+c)}catch(e){log('Write失敗: '+e.message)}}
function clearData(){samples=[];$('count').textContent='0';$('duration').textContent='0.00 s';$('maxg').textContent='-';$('cadence').textContent='-';$('csv').disabled=true;draw()}
async function startRec(){clearData();$('dlstate').textContent='計測中';await writeCmd('START')}
async function stopRec(){await writeCmd('STOP');$('dlstate').textContent='計測停止。DOWNLOADしてください'}
async function download(){clearData();downloading=true;$('dlstate').textContent='DOWNLOAD中...';await writeCmd('DOWNLOAD');resetTimer()}
function resetTimer(){if(timer)clearTimeout(timer);if(!downloading)return;timer=setTimeout(()=>{downloading=false;$('dlstate').textContent=`DOWNLOAD完了: ${samples.length} samples`;log('DOWNLOAD完了と判断');analyze();draw();$('csv').disabled=!samples.length},1500)}
function onData(e){const v=e.target.value;if(v.byteLength<18)return;const seq=v.getUint16(0,true), timeUs=v.getUint32(2,true), ax=v.getInt16(6,true)/1000, ay=v.getInt16(8,true)/1000, az=v.getInt16(10,true)/1000, gx=v.getInt16(12,true)/10, gy=v.getInt16(14,true)/10, gz=v.getInt16(16,true)/10;const amag=Math.hypot(ax,ay,az),gmag=Math.hypot(gx,gy,gz);samples.push({seq,timeUs,ax,ay,az,gx,gy,gz,amag,gmag});$('count').textContent=samples.length;if(samples.length>1)$('duration').textContent=times().at(-1).toFixed(2)+' s';if(downloading){$('dlstate').textContent=`DOWNLOAD中... ${samples.length} samples`;resetTimer()}if(samples.length%100===0)draw()}
function times(){if(!samples.length)return[];const t=[0];for(let i=1;i<samples.length;i++){const d=(samples[i].timeUs-samples[i-1].timeUs)>>>0;t.push(t[i-1]+d/1e6)}return t}
function ma(a,w=5){let o=[],s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=w)s-=a[i-w];o.push(s/Math.min(i+1,w))}return o}
function peaks(a,fs=100){const out=[],dist=Math.round(.35*fs),thr=1.25;let last=-dist;for(let i=1;i<a.length-1;i++){if(a[i]>a[i-1]&&a[i]>=a[i+1]&&a[i]>=thr&&i-last>=dist){out.push(i);last=i}}return out}
function analyze(){if(!samples.length)return;const t=times(),a=ma(samples.map(s=>s.amag),5),p=peaks(a),max=Math.max(...samples.map(s=>s.amag));$('maxg').textContent=max.toFixed(2);if(p.length>=2){let ints=[];for(let i=1;i<p.length;i++)ints.push(t[p[i]]-t[p[i-1]]);ints.sort((x,y)=>x-y);const med=ints[Math.floor(ints.length/2)],cad=120/med;$('cadence').textContent=cad.toFixed(0);log(`解析: peaks=${p.length}, median=${med.toFixed(3)} s, cadence≈${cad.toFixed(1)} spm`)}else{$('cadence').textContent='-';log('接地候補不足')}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(samples.length<2){ctx.fillText('データなし',20,30);return}const t=times(),a=ma(samples.map(s=>s.amag),5),p=peaks(a);let ymin=Math.min(...a),ymax=Math.max(...a);if(ymax-ymin<.1){ymin-=.05;ymax+=.05}const L=55,R=15,T=15,B=35,w=canvas.width-L-R,h=canvas.height-T-B,tmax=t.at(-1)||1,X=x=>L+x/tmax*w,Y=y=>T+(ymax-y)/(ymax-ymin)*h;ctx.strokeStyle='#999';ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+h);ctx.lineTo(L+w,T+h);ctx.stroke();ctx.strokeStyle='#1565c0';ctx.lineWidth=2;ctx.beginPath();a.forEach((y,i)=>{const x=X(t[i]),yy=Y(y);i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)});ctx.stroke();ctx.fillStyle='#c62828';p.forEach(i=>{ctx.beginPath();ctx.arc(X(t[i]),Y(a[i]),4,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#111';ctx.font='18px sans-serif';ctx.fillText('a_mag [g]',5,22);ctx.fillText('0 s',L-5,canvas.height-8);ctx.fillText(tmax.toFixed(1)+' s',canvas.width-70,canvas.height-8)}
function exportCSV(){if(!samples.length)return;const t=times(),lines=['time_s,seq,device_time_us,ax_g,ay_g,az_g,gx_dps,gy_dps,gz_dps,a_mag_g,g_mag_dps'];samples.forEach((s,i)=>lines.push([t[i].toFixed(6),s.seq,s.timeUs,s.ax.toFixed(4),s.ay.toFixed(4),s.az.toFixed(4),s.gx.toFixed(2),s.gy.toFixed(2),s.gz.toFixed(2),s.amag.toFixed(4),s.gmag.toFixed(2)].join(',')));const blob=new Blob([lines.join('
')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='RunSensor_'+new Date().toISOString().replace(/[:.]/g,'-')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);log('CSV出力')}
$('connect').onclick=connectBLE;$('disconnect').onclick=()=>device?.gatt?.disconnect();$('start').onclick=startRec;$('stop').onclick=stopRec;$('download').onclick=download;$('clear').onclick=clearData;$('csv').onclick=exportCSV;draw();
</script></body></html>
